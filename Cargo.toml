[workspace]
resolver = "2"
members = ["core", "app"]

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true

# Kształtowanie tekstu, renderer i dekodery obrazów z optymalizacją także w buildzie dev –
# inaczej pisanie w dłuższym dokumencie wyraźnie się przycina.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
