[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.7.0"
authors = ["Adam Rędzikowski"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
opendtp-base = { path = "crates/base" }
opendtp-doc = { path = "crates/doc" }
opendtp-text = { path = "crates/text" }
opendtp-format = { path = "crates/format" }
opendtp-render = { path = "crates/render" }
opendtp-io = { path = "crates/io" }
opendtp-ai = { path = "crates/ai" }
opendtp-update = { path = "crates/update" }
opendtp-tools = { path = "crates/tools" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ttf-parser = "0.25"
rustybuzz = "0.20"
fontdb = "0.23"
tiny-skia = "0.11"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
spellbook = "0.4"
krilla = "0.8"
krilla-svg = "0.8"
usvg = "0.47"
resvg = "0.47"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
dirs = "6"
parking_lot = "0.12"
i_overlay = "9"
hyphenation = { version = "0.8", features = ["embed_all"] }
regex = "1"
base64 = "0.22"
windows = { version = "0.61", features = ["Win32_Globalization", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_DataExchange"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true

# Kształtowanie tekstu, renderer i dekodery obrazów z optymalizacją także w buildzie dev –
# inaczej pisanie w dłuższym dokumencie wyraźnie się przycina.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
