[package]
name = "opendtp-core"
version = "0.6.0"
description = "OpenDTP – model dokumentu, silnik składu, renderer, eksport i aktualizacje"
authors = ["Adam Rędzikowski"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "opendtp_core"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ttf-parser = "0.25"
rustybuzz = "0.20"
fontdb = "0.23"
tiny-skia = "0.11"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
spellbook = "0.4"
krilla = "0.8"
krilla-svg = "0.8"
usvg = "0.47"
resvg = "0.47"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
dirs = "6"
parking_lot = "0.12"
i_overlay = "9"
unicode-normalization = "0.1"
hyphenation = { version = "0.8", features = ["embed_all"] }
regex = "1"

[dev-dependencies]

[dependencies.windows]
version = "0.61"
features = ["Win32_Globalization", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]
